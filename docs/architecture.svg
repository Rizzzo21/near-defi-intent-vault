<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="monospace">
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">INTENT-VAULT — quote → intent → solver → vault</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#555">NEAR testnet contract: ivault-backstop-1109.testnet (deployed 2026-11-09)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Agent -->
  <rect x="30" y="110" width="150" height="90" rx="8" fill="#eef4ff" stroke="#3355aa" stroke-width="2"/>
  <text x="105" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Agent</text>
  <text x="105" y="162" text-anchor="middle" font-size="11" fill="#333">holds 5,000 Base</text>
  <text x="105" y="178" text-anchor="middle" font-size="11" fill="#333">USDC (eip155:8453)</text>

  <!-- Quote -->
  <rect x="230" y="110" width="170" height="90" rx="8" fill="#fff7e6" stroke="#aa7711" stroke-width="2"/>
  <text x="315" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">1 · Quote</text>
  <text x="315" y="162" text-anchor="middle" font-size="11" fill="#333">5,000 x 0.9992</text>
  <text x="315" y="178" text-anchor="middle" font-size="11" fill="#333">= 4,996 out, 4.00 fee</text>

  <!-- Intent -->
  <rect x="450" y="110" width="170" height="90" rx="8" fill="#eaffea" stroke="#227722" stroke-width="2"/>
  <text x="535" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">2 · Intent</text>
  <text x="535" y="162" text-anchor="middle" font-size="11" fill="#333">sha256(canonical</text>
  <text x="535" y="178" text-anchor="middle" font-size="11" fill="#333">intent JSON) — hash</text>

  <!-- Solver -->
  <rect x="670" y="110" width="150" height="90" rx="8" fill="#fdeaea" stroke="#aa2222" stroke-width="2"/>
  <text x="745" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">3 · Solver (stub)</text>
  <text x="745" y="162" text-anchor="middle" font-size="11" fill="#333">verifies quote math</text>
  <text x="745" y="178" text-anchor="middle" font-size="11" fill="#333">records intent hash</text>

  <!-- Vault -->
  <rect x="300" y="270" width="320" height="100" rx="8" fill="#f0eaff" stroke="#6622aa" stroke-width="2"/>
  <text x="460" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">4 · EarningsVault (on-chain)</text>
  <text x="460" y="322" text-anchor="middle" font-size="11" fill="#333">deposit 4,000 → 4,000 shares · accrue 120 → price 1.0300</text>
  <text x="460" y="338" text-anchor="middle" font-size="11" fill="#333">redeem 2,000 shares → 2,060.00 USDC · replay → REFUSED</text>
  <text x="460" y="354" text-anchor="middle" font-size="11" fill="#333">share price = assets / shares, recomputed (integer micro-USDC)</text>

  <!-- Arrows -->
  <line x1="180" y1="155" x2="228" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="155" x2="448" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="155" x2="668" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="200" x2="745" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="252" x2="470" y2="268" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="228" text-anchor="middle" font-size="11" fill="#333">settle</text>
  <text x="545" y="252" text-anchor="middle" font-size="11" fill="#333">4,996 USDC in</text>

  <text x="460" y="400" text-anchor="middle" font-size="11" fill="#777">Stub solver: execute_intent() checks the quote math on-chain and stores the intent hash; it does not call intents.near execute_intents. Yield accrual is a demo step (amount supplied by the caller).</text>
</svg>
